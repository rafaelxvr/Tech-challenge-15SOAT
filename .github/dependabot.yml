version: 2
updates:
  # Mantém as Actions pinadas por SHA atualizadas (o Dependabot atualiza SHA + comentário de versão).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    target-branch: "develop"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
