# Pipeline CI/CD — Oficina Mecânica (Fase 2)
name: CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

env:
  IMAGE_NAME: oficina-mecanica
  REGISTRY: ghcr.io

jobs:
  build-and-test:
    name: Build + Testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verificar toolchain
        shell: pwsh
        run: ./scripts/check-toolchain.ps1

      - name: Build e testes automatizados
        run: ./mvnw -B verify

  integration-test:
    name: Testes de integracao com Docker
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verificar Docker
        run: docker info

      - name: Executar gate com Testcontainers habilitado
        run: ./mvnw -B verify

  docker-image:
    name: Build imagem Docker
    needs: [build-and-test, integration-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_base: ${{ steps.names.outputs.image_base }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR exige owner/repo em minúsculas (ex.: SilasFurini → silasfurini)
      - name: Normalizar nome da imagem
        id: names
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lc=${OWNER_LC}" >> "$GITHUB_OUTPUT"
          echo "image_base=${{ env.REGISTRY }}/${OWNER_LC}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Login GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.image_base }}
          tags: |
            type=sha,prefix=

      - name: Build (e push se não for PR)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: ${{ github.event_name == 'pull_request' }}

  deploy-k8s:
    name: Deploy Kubernetes (Kind)
    needs: docker-image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Create Kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: oficina-ci
          version: v0.33.0
          wait: 120s

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull e carregar imagem no Kind
        run: |
          DIGEST="${{ needs.docker-image.outputs.digest }}"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Digest de imagem invalido: $DIGEST" >&2
            exit 1
          fi
          IMAGE="${{ needs.docker-image.outputs.image_base }}@${DIGEST}"
          echo "Usando imagem: $IMAGE"
          docker pull "$IMAGE"
          kind load docker-image "$IMAGE" --name oficina-ci
          sed -i "s|image: .*oficina-mecanica.*|image: ${IMAGE}|g" k8s/app.yaml
          sed -i "s|imagePullPolicy: IfNotPresent|imagePullPolicy: Never|g" k8s/app.yaml

      - name: Deploy banco de dados (manifestos)
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/postgres.yaml
          kubectl -n oficina rollout status deployment/oficina-postgres --timeout=180s

      - name: Aplicar manifestos da aplicação (HPA, Service, Deployment)
        run: |
          kubectl apply -f k8s/mailhog.yaml
          kubectl apply -f k8s/app.yaml
          kubectl -n oficina rollout status deployment/oficina-app --timeout=300s
          kubectl -n oficina get deploy,svc,hpa,pods

      - name: Smoke test health
        run: |
          kubectl -n oficina port-forward svc/oficina-app 8080:8080 &
          sleep 5
          curl -sf http://127.0.0.1:8080/api/actuator/health
          echo
