name: APP staging deploy

on:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: app-staging-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  APP_ARTIFACT_BUCKET: oficina-phase3-artifacts-16225b7358
  APP_SOURCE_PREFIX: releases/app/staging
  APP_PROJECT_NAME: oficina-phase3-oficina-app-staging-deploy
  # These values are rendered into the platform-owned executor. Keep them
  # explicit here so the staging workflow and APP deploy contract cannot drift.
  APP_TERRAFORM_BACKEND_KEY: app/staging.tfstate
  APP_TERRAFORM_BACKEND_LOCK_KEY: app/staging.tfstate.tflock
  APP_TERRAFORM_EXECUTOR_TFVARS_PATH: /tmp/oficina/app_staging.tfvars.json

jobs:
  staging-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.APP_CLOUD_DEPLOYMENT_ENABLED == 'true'
    environment:
      name: staging
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate reviewed staging inputs
        shell: pwsh
        env:
          APP_CLOUD_DEPLOYMENT_ROLE_ARN: ${{ vars.APP_CLOUD_DEPLOYMENT_ROLE_ARN }}
          APP_RELEASE_INPUT_PATH: ${{ vars.APP_RELEASE_INPUT_PATH }}
          APP_PLATFORM_INPUTS_PATH: ${{ vars.APP_PLATFORM_INPUTS_PATH }}
          APP_STAGING_WORKLOAD_PATH: ${{ vars.APP_STAGING_WORKLOAD_PATH }}
          APP_CLOUD_WINDOW_EVIDENCE_PATH: ${{ vars.APP_CLOUD_WINDOW_EVIDENCE_PATH }}
          APP_TERRAFORM_VARIABLES_PATH: ${{ vars.APP_TERRAFORM_VARIABLES_PATH }}
          APP_TERRAFORM_VARIABLES_SHA256: ${{ vars.APP_TERRAFORM_VARIABLES_SHA256 }}
          APP_DEPLOYER_IMAGE_DIGEST: ${{ vars.APP_DEPLOYER_IMAGE_DIGEST }}
        run: |
          $required = @{
            APP_CLOUD_DEPLOYMENT_ROLE_ARN = $env:APP_CLOUD_DEPLOYMENT_ROLE_ARN
            APP_RELEASE_INPUT_PATH = $env:APP_RELEASE_INPUT_PATH
            APP_PLATFORM_INPUTS_PATH = $env:APP_PLATFORM_INPUTS_PATH
            APP_STAGING_WORKLOAD_PATH = $env:APP_STAGING_WORKLOAD_PATH
            APP_CLOUD_WINDOW_EVIDENCE_PATH = $env:APP_CLOUD_WINDOW_EVIDENCE_PATH
            APP_TERRAFORM_VARIABLES_PATH = $env:APP_TERRAFORM_VARIABLES_PATH
            APP_TERRAFORM_VARIABLES_SHA256 = $env:APP_TERRAFORM_VARIABLES_SHA256
            APP_DEPLOYER_IMAGE_DIGEST = $env:APP_DEPLOYER_IMAGE_DIGEST
          }
          foreach ($entry in $required.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace($entry.Value)) {
              throw "Required reviewed staging variable is missing: $($entry.Key)."
            }
          }
          if ($env:APP_CLOUD_DEPLOYMENT_ROLE_ARN -cnotmatch '^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$') {
            throw 'APP_CLOUD_DEPLOYMENT_ROLE_ARN must be a reviewed same-account IAM role ARN.'
          }
          foreach ($path in @($env:APP_RELEASE_INPUT_PATH, $env:APP_PLATFORM_INPUTS_PATH, $env:APP_STAGING_WORKLOAD_PATH, $env:APP_CLOUD_WINDOW_EVIDENCE_PATH, $env:APP_TERRAFORM_VARIABLES_PATH)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Reviewed staging input file does not exist: $path."
            }
          }

      - name: Package reviewed source and release manifest
        id: package
        shell: pwsh
        env:
          APP_RELEASE_INPUT_PATH: ${{ vars.APP_RELEASE_INPUT_PATH }}
          APP_PLATFORM_INPUTS_PATH: ${{ vars.APP_PLATFORM_INPUTS_PATH }}
        run: |
          $handoff = Join-Path $env:RUNNER_TEMP "oficina-app-staging-$env:GITHUB_SHA"
          & ./scripts/offline-release-handoff.ps1 `
            -SourceCommit $env:GITHUB_SHA `
            -ReleaseInputFile $env:APP_RELEASE_INPUT_PATH `
            -PlatformInputsFile $env:APP_PLATFORM_INPUTS_PATH `
            -OutputDirectory $handoff
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed APP source/release packaging failed.' }
          $sourceZip = Join-Path $handoff 'source.zip'
          $manifest = Join-Path $handoff 'release-manifest.json'
          if (-not (Test-Path -LiteralPath $sourceZip -PathType Leaf) -or -not (Test-Path -LiteralPath $manifest -PathType Leaf)) {
            throw 'Reviewed APP packaging did not produce source.zip and release-manifest.json.'
          }
          $sourceSha = (Get-FileHash -LiteralPath $sourceZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifestSha = (Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash.ToLowerInvariant()
          "source_zip=$sourceZip" >> $env:GITHUB_OUTPUT
          "manifest=$manifest" >> $env:GITHUB_OUTPUT
          "source_sha=$sourceSha" >> $env:GITHUB_OUTPUT
          "manifest_sha=$manifestSha" >> $env:GITHUB_OUTPUT

      - name: Validate immutable deployment bindings without AWS
        shell: pwsh
        env:
          APP_PLATFORM_INPUTS_PATH: ${{ vars.APP_PLATFORM_INPUTS_PATH }}
          APP_STAGING_WORKLOAD_PATH: ${{ vars.APP_STAGING_WORKLOAD_PATH }}
          APP_CLOUD_WINDOW_EVIDENCE_PATH: ${{ vars.APP_CLOUD_WINDOW_EVIDENCE_PATH }}
          APP_TERRAFORM_VARIABLES_PATH: ${{ vars.APP_TERRAFORM_VARIABLES_PATH }}
          APP_TERRAFORM_VARIABLES_SHA256: ${{ vars.APP_TERRAFORM_VARIABLES_SHA256 }}
          APP_DEPLOYER_IMAGE_DIGEST: ${{ vars.APP_DEPLOYER_IMAGE_DIGEST }}
        run: |
          & ./scripts/start-deploy.ps1 `
            -Environment staging `
            -SourceZip '${{ steps.package.outputs.source_zip }}' `
            -ExpectedSha256 '${{ steps.package.outputs.source_sha }}' `
            -ReleaseManifest '${{ steps.package.outputs.manifest }}' `
            -ExpectedManifestSha256 '${{ steps.package.outputs.manifest_sha }}' `
            -TerraformVariablesFile $env:APP_TERRAFORM_VARIABLES_PATH `
            -ExpectedTerraformVariablesSha256 $env:APP_TERRAFORM_VARIABLES_SHA256 `
            -DeployerImageDigest $env:APP_DEPLOYER_IMAGE_DIGEST `
            -Bucket $env:APP_ARTIFACT_BUCKET `
            -SourcePrefix $env:APP_SOURCE_PREFIX `
            -ProjectName $env:APP_PROJECT_NAME `
            -SourceCommit $env:GITHUB_SHA `
            -PlatformInputsFile $env:APP_PLATFORM_INPUTS_PATH `
            -StagingWorkloadFile $env:APP_STAGING_WORKLOAD_PATH `
            -CloudWindowEvidenceFile $env:APP_CLOUD_WINDOW_EVIDENCE_PATH `
            -EventName $env:GITHUB_EVENT_NAME `
            -BranchRef $env:GITHUB_REF `
            -DryRun

      - name: Configure AWS OIDC for reviewed staging launcher
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.APP_CLOUD_DEPLOYMENT_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: app-staging-${{ github.run_id }}

      - name: Launch reviewed staging deployment
        shell: pwsh
        env:
          APP_PLATFORM_INPUTS_PATH: ${{ vars.APP_PLATFORM_INPUTS_PATH }}
          APP_STAGING_WORKLOAD_PATH: ${{ vars.APP_STAGING_WORKLOAD_PATH }}
          APP_CLOUD_WINDOW_EVIDENCE_PATH: ${{ vars.APP_CLOUD_WINDOW_EVIDENCE_PATH }}
          APP_TERRAFORM_VARIABLES_PATH: ${{ vars.APP_TERRAFORM_VARIABLES_PATH }}
          APP_TERRAFORM_VARIABLES_SHA256: ${{ vars.APP_TERRAFORM_VARIABLES_SHA256 }}
          APP_DEPLOYER_IMAGE_DIGEST: ${{ vars.APP_DEPLOYER_IMAGE_DIGEST }}
        run: |
          $promotion = Join-Path $env:RUNNER_TEMP 'app-staging-promotion-receipt.json'
          & ./scripts/start-deploy.ps1 `
            -Environment staging `
            -SourceZip '${{ steps.package.outputs.source_zip }}' `
            -ExpectedSha256 '${{ steps.package.outputs.source_sha }}' `
            -ReleaseManifest '${{ steps.package.outputs.manifest }}' `
            -ExpectedManifestSha256 '${{ steps.package.outputs.manifest_sha }}' `
            -TerraformVariablesFile $env:APP_TERRAFORM_VARIABLES_PATH `
            -ExpectedTerraformVariablesSha256 $env:APP_TERRAFORM_VARIABLES_SHA256 `
            -DeployerImageDigest $env:APP_DEPLOYER_IMAGE_DIGEST `
            -Bucket $env:APP_ARTIFACT_BUCKET `
            -SourcePrefix $env:APP_SOURCE_PREFIX `
            -ProjectName $env:APP_PROJECT_NAME `
            -SourceCommit $env:GITHUB_SHA `
            -PlatformInputsFile $env:APP_PLATFORM_INPUTS_PATH `
            -StagingWorkloadFile $env:APP_STAGING_WORKLOAD_PATH `
            -CloudWindowEvidenceFile $env:APP_CLOUD_WINDOW_EVIDENCE_PATH `
            -PromotionEvidenceOutputFile $promotion `
            -EventName $env:GITHUB_EVENT_NAME `
            -BranchRef $env:GITHUB_REF
          if ($LASTEXITCODE -ne 0) { throw 'APP staging deployment launcher failed.' }

      - name: Upload reviewed staging promotion receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-staging-promotion-${{ github.sha }}
          path: ${{ runner.temp }}/app-staging-promotion-receipt.json
          if-no-files-found: error
