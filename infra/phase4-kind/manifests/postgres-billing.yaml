# Disposable PostgreSQL 16 for billing (billing). Data lives in emptyDir and dies with the cluster.
# The superuser password comes from Secret postgres-billing-admin, created by scripts/phase4-kind.ps1
# at runtime (random per cluster). Nothing secret is versioned.
apiVersion: v1
kind: Service
metadata:
  name: postgres-billing
  namespace: data
spec:
  selector: { app: postgres-billing }
  ports:
    - { name: postgres, port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-billing
  namespace: data
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: postgres-billing }
  template:
    metadata:
      labels: { app: postgres-billing }
    spec:
      containers:
        - name: postgres
          image: postgres:16.6-alpine@sha256:1d04b9ba1d4996401f2552b51beda8187f175c0645c091e4781134fc9c9a3eef
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_DB, value: billing }
            - { name: POSTGRES_USER, value: postgres }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-billing-admin, key: password }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres", "-d", "billing"] }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - { name: data, emptyDir: {} }
