apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-os-service
spec:
  replicas: 1
  selector:
    matchLabels: {}
  template:
    spec:
      serviceAccountName: oficina-os-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: os-service
          # Tag trocada pelo SHA em scripts/phase4-kind-stack.ps1; nunca `latest` como contrato.
          image: oficina-os-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: oficina-os-service-config }
            # Chave pública descartável do cliente (SPRING_APPLICATION_JSON), gerada por cluster pelo script; sem chave privada.
            - configMapRef: { name: oficina-os-customer-trust }
          env:
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: oficina-os-secrets, key: jwt_secret } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: oficina-os-secrets, key: db_app_password } }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          startupProbe:
            httpGet: { path: /api/actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 48
          readinessProbe:
            httpGet: { path: /api/actuator/health/readiness, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/actuator/health/liveness, port: http }
            periodSeconds: 20
      volumes:
        - { name: tmp, emptyDir: {} }
