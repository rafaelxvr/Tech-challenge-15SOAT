spring:
  application:
    name: oficina-mecanica

  # ========================
  #    BANCO DE DADOS
  # ========================
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oficina_mecanica}
    username: ${DB_USERNAME:oficina}
    password: ${DB_PASSWORD:oficina123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 1000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  # ========================
  #    FLYWAY
  # ========================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# ========================
#    JACKSON
# ========================
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

# ========================
#    SERVIDOR
# ========================
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  error:
    include-message: never
    include-binding-errors: never

# ========================
#    JWT
# ========================
security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}  # 24 horas em ms
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 dias em ms
    staff:
      issuer: ${JWT_STAFF_ISSUER}
      audience: ${JWT_STAFF_AUDIENCE}
      key-id: ${JWT_STAFF_KEY_ID}
    customer:
      issuer: ${JWT_CUSTOMER_ISSUER}
      audience: ${JWT_CUSTOMER_AUDIENCE}
      # Supply security.jwt.customer.public-keys via a config file or SPRING_APPLICATION_JSON.
      # Map each trusted kid to an X.509 SubjectPublicKeyInfo PEM RSA public key; no URL resolution.

oficina:
  outbox:
    enabled: ${OUTBOX_ENABLED:false}
    region: ${AWS_REGION:us-east-1}
    queue-url: ${OUTBOX_QUEUE_URL:}
  historico:
    # Fresh synthetic installations use UTC. Existing deployments must supply a proven
    # compatibility zone; this setting NEVER backfills legacy canonical timestamps.
    zona-compatibilidade: ${HISTORICO_ZONA_COMPATIBILIDADE}
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:noreply@oficina.com}

# ========================
#    OPENAPI / SWAGGER
# ========================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false

# ========================
#    ACTUATOR
# ========================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState

# ========================
#    LOGGING
# ========================
logging:
  level:
    com.oficina: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

---
# ========================
#    PROFILE: dev
# ========================
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    com.oficina: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

---
# ========================
#    PROFILE: test
# ========================
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:tc:postgresql:16:///oficina_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  flyway:
    enabled: true

oficina:
  mail:
    enabled: false
