spring:
  application:
    name: oficina-mecanica

  # ========================
  #    BANCO DE DADOS
  # ========================
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oficina_mecanica}
    username: ${DB_USERNAME:oficina}
    password: ${DB_PASSWORD:oficina123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  # ========================
  #    FLYWAY
  # ========================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ========================
  #    JACKSON
  # ========================
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

# ========================
#    SERVIDOR
# ========================
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always

# ========================
#    JWT
# ========================
security:
  jwt:
    secret: ${JWT_SECRET:3cTp9vQzXkN8mR2jL5wY7aB4fH6dE1iU0oP}
    expiration: ${JWT_EXPIRATION:86400000}  # 24 horas em ms
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 dias em ms

# ========================
#    OPENAPI / SWAGGER
# ========================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false

# ========================
#    ACTUATOR
# ========================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# ========================
#    LOGGING
# ========================
logging:
  level:
    com.oficina: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

---
# ========================
#    PROFILE: dev
# ========================
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true

logging:
  level:
    com.oficina: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

---
# ========================
#    PROFILE: test
# ========================
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:tc:postgresql:16:///oficina_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  flyway:
    enabled: true

  jpa:
    show-sql: true
