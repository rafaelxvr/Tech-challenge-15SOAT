# Overlay AWS Academy (Learner Lab) do os-service. Offline: renderiza com `kubectl kustomize k8s-overlays/aws`.
# Diferencas para a base: sem PostgreSQL/Mailhog/Secret/HPA em pod (RDS e Secret por stdin, S-11),
# Service ClusterIP (entrada por `kubectl port-forward 127.0.0.1`; sem NodePort/LoadBalancer),
# perfil Spring `aws`, imagem GHCR por digest. billing/execution tem overlays nos proprios repositorios.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: oficina
resources:
  - ../../k8s
patches:
  - path: remove-local-deps.yaml
  - path: app-aws.yaml
  - target:
      kind: ConfigMap
      name: oficina-config
    path: configmap-aws.json
images:
  # A base remapeia para oficina-mecanica:local; aqui vai para o GHCR pinado por digest.
  # Digest = infra/aws-academy/release-manifest.json (verify-overlay.sh --release confere os dois).
  # Pacote privado ate o Rafael torna-lo publico na UI do GitHub (UNR-709): sem isso o pull falha no cluster.
  - name: oficina-mecanica
    newName: ghcr.io/rafaelxvr/oficina-mecanica
    digest: sha256:ad58cfdef257018729129b18a47f7612e854fd6b17d7943d6be80b336d5308b3
